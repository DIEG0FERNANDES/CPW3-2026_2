<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diário do Estudante</title>
</head>

<body>
  <h2>Escreva uma entrada para seu diário</h2>
  <form action="http://localhost:3000/estudo" method="post">
    <input type="text" name="materia" placeholder="Matéria" required>
    <br><br>
    <textarea name="resumo" placeholder="Resumo" required></textarea>
    <br><br>
    <button type="submit">Enviar entrada</button>
  </form>
</body>

</html>
